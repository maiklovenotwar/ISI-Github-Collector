name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      # Runs the same hooks contributors run locally (ruff, black, detect-secrets),
      # at the versions pinned in .pre-commit-config.yaml.
      - uses: pre-commit/action@v3.0.1

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Tests marked `external` or `orbis_integration` need live GitHub tokens or
      # VPN access to Orbis and are deselected by default (see pyproject.toml).
      - name: Run tests
        run: pytest --cov=github_collector --cov-report=term-missing
