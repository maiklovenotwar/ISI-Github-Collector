name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      # Runs the same hooks contributors run locally (ruff, black, detect-secrets),
      # at the versions pinned in .pre-commit-config.yaml. On failure the output is
      # also written as an annotation, which can be read without access to the logs.
      - name: Run pre-commit
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          set +e
          pre-commit run --show-diff-on-failure --all-files > pre-commit.log 2>&1
          status=$?
          set -e
          cat pre-commit.log
          if [ "$status" -ne 0 ]; then
            msg=$(tail -c 30000 pre-commit.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=pre-commit output::${msg}"
          fi
          exit "$status"

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Tests marked `external` or `orbis_integration` need live GitHub tokens or
      # VPN access to Orbis and are deselected by default (see pyproject.toml).
      - name: Run tests
        run: pytest --cov=github_collector --cov-report=term-missing
