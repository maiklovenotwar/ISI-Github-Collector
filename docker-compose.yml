# Docker Compose für lokales Monitoring-Testing
# Phase 4.2: Prometheus + Grafana Stack
#
# Verwendung:
#   docker-compose up -d
#   
# Dann:
#   - Prometheus: http://localhost:9090
#   - Grafana:    http://localhost:3000 (admin/admin)

version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: github-collector-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    # Für Linux: host.docker.internal manuell setzen
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: github-collector-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # Optional: Dashboard auto-provisioning (für später)
      # - ./monitoring:/etc/grafana/provisioning/dashboards:ro
    environment:
      # Einfacher Login für lokales Testing
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Anonymen Zugriff erlauben (optional)
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Server-Einstellungen
      - GF_SERVER_ROOT_URL=http://localhost:3000
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
